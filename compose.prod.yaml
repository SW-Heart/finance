services:
  finance-db:
    image: postgres:15-alpine
    container_name: finance-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-finance_vault}
    volumes:
      - finance_db_data:/var/lib/postgresql/data
    restart: always
    networks:
      - finance-network

  finance-backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: finance-backend
    environment:
      # Database
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-password}@finance-db:5432/${POSTGRES_DB:-finance_vault}

      # Security (CORS)
      ALLOW_ORIGINS: ${ALLOW_ORIGINS}

      # External Services
      ALIYUN_ACCESS_KEY_ID: ${ALIYUN_ACCESS_KEY_ID}
      ALIYUN_ACCESS_KEY_SECRET: ${ALIYUN_ACCESS_KEY_SECRET}
      SMS_SIGN_NAME: ${SMS_SIGN_NAME}
      SMS_TEMPLATE_CODE: ${SMS_TEMPLATE_CODE}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
    ports:
      - "3001:3001"
    depends_on:
      - finance-db
    restart: always
    networks:
      - finance-network

  finance-frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
    container_name: finance-frontend
    ports:
      - "80:80"
      #- "443:443" # Uncomment if you configure SSL in nginx
    restart: always
    networks:
      - finance-network

volumes:
  finance_db_data:


networks:
  finance-network:
    driver: bridge
